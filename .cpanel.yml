---
# cPanel Git Version Control deployment.
# När du pushar till repot kör cPanel dessa steg och kopierar sidan till public_html.
#
# Ligger sidan i en underdomän/underkatalog, peka DEPLOYPATH dit i stället.
deployment:
  tasks:
    - export DEPLOYPATH=/home/kungsba4/public_html/
    - /bin/cp index.html "${DEPLOYPATH}"
    - /bin/cp integritetspolicy.html "${DEPLOYPATH}"
    - /bin/cp radera-konto.html "${DEPLOYPATH}"
    - /bin/cp anvandarvillkor.html "${DEPLOYPATH}"
    - /bin/cp community-regler.html "${DEPLOYPATH}"
    - /bin/cp support.html "${DEPLOYPATH}"
    - /bin/cp .htaccess "${DEPLOYPATH}"
    - /bin/cp -R assets "${DEPLOYPATH}"
    - /bin/cp -R data "${DEPLOYPATH}"
    # Webbservern körs som "nobody" och måste kunna läsa katalogen.
    # (Migrationen från WordPress satte fel grupp och 0750 -> 403/404.)
    - /bin/chmod 755 "${DEPLOYPATH}"
